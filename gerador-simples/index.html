<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Banners — Waynne AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header class="page-header">
      <h1>WAYNNE AI — Gerador de Banners</h1>
      <p>Preencha os dados e gere seu banner pronto</p>
    </header>

    <main class="grid-layout">
      <!-- Formulário de preenchimento -->
      <section class="form-section">
        <h2>Dados do Produto</h2>

        <label for="categoria">Categoria:</label>
        <select id="categoria">
          <option value="informatica">Informática</option>
          <option value="eletronico">Eletrônico</option>
          <option value="game">Game</option>
          <option value="moda">Moda</option>
          <option value="casa">Casa</option>
          <option value="beleza">Beleza</option>
          <option value="esporte">Esporte</option>
        </select>

        <label for="nomeProduto">Nome do Produto:</label>
        <input type="text" id="nomeProduto" placeholder="Ex: Monitor Gamer Samsung Odyssey G5">

        <label for="destaques">Destaques / Especificações:</label>
        <input type="text" id="destaques" placeholder="Ex: 27'' QHD | 165Hz">

        <label for="precoAntigo">Preço de Referência (de):</label>
        <input type="text" id="precoAntigo" placeholder="R$ 1.499,00">

        <label for="precoNovo">Preço Promocional (por):</label>
        <input type="text" id="precoNovo" placeholder="R$ 1.046,63">

        <label for="pagamento">Condição de Pagamento:</label>
        <input type="text" id="pagamento" placeholder="Ou 10x R$ 107,90 sem juros">

        <label>8 Benefícios (um por linha):</label>
        <textarea id="beneficios" rows="8" placeholder="Tela 27'' QHD&#10;165Hz&#10;Tela Curva&#10;Modo Game Otimizado&#10;Imagem Cristalina&#10;Resposta Ultra Rápida&#10;Conforto Visual&#10;Qualidade Samsung"></textarea>

        <button id="gerarBtn">Gerar Banner</button>
      </section>

      <!-- Área de visualização do banner -->
      <section class="preview-section">
        <h2>Pré-visualização</h2>
        <div id="bannerContainer">
          <div id="banner">
            <p class="banner-placeholder">Preencha os dados ao lado e clique em "Gerar Banner"</p>
          </div>
        </div>
        <button id="baixarBtn" style="display:none;">Baixar Imagem</button>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
